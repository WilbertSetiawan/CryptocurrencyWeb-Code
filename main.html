<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Cryptex</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'PT Sans', sans-serif;
      background: #161b25;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .login-box {
      background: #12141c;
      padding: 40px;
      border-radius: 24px;
      width: 100%;
      max-width: 400px;
      border: 1px solid #2a2d3a;
    }

    .login-box h2 {
      color: white;
      margin-bottom: 8px;
      font-size: 28px;
    }

    .login-box p {
      color: #8a8f9e;
      margin-bottom: 30px;
      font-size: 14px;
    }

    .input-group {
      margin-bottom: 20px;
    }

    .input-group input {
      width: 100%;
      padding: 14px 16px;
      background: #1a1d27;
      border: 1px solid #2d313e;
      border-radius: 12px;
      font-size: 15px;
      color: white;
      font-family: inherit;
    }

    .input-group input:focus {
      outline: none;
      border-color: #3b82f6;
    }

    .input-group input::placeholder {
      color: #5a5f73;
    }

    .login-btn {
      width: 100%;
      padding: 14px;
      background: #004ecc;
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: 0.3s;
    }

    .login-btn:hover {
      background: #003ab8;
    }

    .error-msg {
      color: #ef4444;
      font-size: 13px;
      margin-top: 12px;
      text-align: center;
      display: none;
    }

    .back-link {
      text-align: center;
      margin-top: 20px;
    }

    .back-link a {
      color: #888888;
      text-decoration: none;
      font-size: 14px;
    }

    .back-link a:hover {
      color: #115bd2;
    }
  </style>
</head>
<body>
  <center>
  <div class="login-box">
    <h2>Welcome Back</h2>
    <p>Login to access your Cryptex dashboard</p>
    <div class="input-group">
      <input type="text" id="username" placeholder="Username" autocomplete="off">
    </div>

    <div class="input-group">
      <input type="password" id="password" placeholder="Password">
    </div>

    <button class="login-btn" onclick="handleLogin()">Login</button>

    <div class="error-msg" id="errorMsg">Invalid username or password</div>

    <div class="back-link">
      <a href="index.html"> Back to Home</a> <a>|</a>
      <a href="signup.html"> SignUp</a>
      </center>
    </div>
  </div>

  <script>
    function handleLogin() {
      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;
      const errorMsg = document.getElementById('errorMsg');

      if (username === 'demo' && password === '1234') {
        errorMsg.style.display = 'none';
        alert('Login successful! Redirecting to dashboard...');
      } else {
        errorMsg.style.display = 'block';
      }
    }

    // Press Enter to login
    document.getElementById('password').addEventListener('keypress', function(e) {
      if (e.key === 'Enter') handleLogin();
    });
  </script>
</body>
</html>
